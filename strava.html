<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Strava</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    nav {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background: #16213e;
    }

    nav .logo {
      font-size: 1.3rem;
      font-weight: bold;
      background: linear-gradient(45deg, #e94560, #ff8c42);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    nav ul { display: flex; gap: 1.5rem; list-style: none; }

    nav a {
      color: #ccc;
      text-decoration: none;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      transition: all 0.3s ease;
    }

    nav a:hover, nav a.active { color: #fff; background: rgba(233, 69, 96, 0.25); }

    h1 { margin: 1.5rem 0 0.5rem; font-size: 1.4rem; }

    #infos { color: #ff8c42; margin-bottom: 1rem; }

    /* Conteneur de la bannière Strava aux dimensions équivalentes à l'ancien canvas */
    .strava-container {
      width: 480px;
      height: 360px;
      background: #16213e;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      text-align: center;
    }

    .strava-badge {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #fc4c02, #ff6b2b);
      color: white;
      width: 100%;
      height: 100%;
      border-radius: 8px;
      text-decoration: none;
      padding: 2rem;
      box-shadow: 0 4px 15px rgba(252, 76, 2, 0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .strava-badge:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(252, 76, 2, 0.5);
    }

    .strava-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    .strava-title {
      font-size: 1.5rem;
      font-weight: bold;
      margin-bottom: 0.5rem;
    }

    .strava-desc {
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.85);
      margin-bottom: 1.5rem;
    }

    .strava-btn {
      background: white;
      color: #fc4c02;
      padding: 0.6rem 1.4rem;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.9rem;
    }

    #message {
      margin-top: 1rem;
      min-height: 1.5rem;
      color: #ccc;
    }
  </style>
</head>
<body>

  <nav>
    <span class="logo">MonSite</span>
    <ul>
      <li><a href="index.html">Accueil</a></li>
      <li><a href="jeu.html" class="active">Strava</a></li>
      <li><a href="#">À propos</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>

  <h1>🏃‍♂️ Mes Activités Strava</h1>
  <div id="infos">Suivi sportif en direct</div>

  <!-- Zone de la bannière Strava (remplace le canvas) -->
  <div class="strava-container">
    <a href="https://www.strava.com/athletes/15593451" target="_blank" rel="noopener noreferrer" class="strava-badge">
      <div class="strava-icon">🚴‍♂️</div>
      <div class="strava-title">Profil Strava</div>
      <div class="strava-desc">Découvrez mes sorties vélo, course à pied et mes statistiques d'entraînement.</div>
      <span class="strava-btn">Voir mon profil</span>
    </a>
  </div>

  <p id="message">Cliquez sur la bannière pour accéder à mon profil Strava.</p>

</body>
</html>
